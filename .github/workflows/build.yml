name: VideoLab Windows
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.200
      - name: Build native C# download engine
        shell: pwsh
        env:
          VIDEOLAB_PLUGIN_SIGNING_KEY: ${{ secrets.VIDEOLAB_PLUGIN_SIGNING_KEY }}
        run: |
          $env:DOTNET_CLI_HOME = Join-Path $pwd 'build/dotnet-home'
          $arguments = @('run','--project','src/VideoLab.Packaging/VideoLab.Packaging.csproj','-c','Release','--','bundle')
          if ($env:VIDEOLAB_PLUGIN_SIGNING_KEY) { $arguments += '--release' }
          & dotnet @arguments
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install media test tools
        run: choco install ffmpeg --yes --no-progress
      - name: Native and managed regression
        shell: pwsh
        run: |
          $env:FFMPEG_TEST_PATH = (Get-Command ffmpeg).Source
          ./tools/build_winui.ps1 -Task Test -SkipBundle
      - name: Publish native application
        run: ./tools/build_winui.ps1 -Task Package -SkipBundle
      - uses: actions/upload-artifact@v4
        with:
          name: videolab-windows-x64
          path: |
            dist/*
            build/test-results/*.trx
          if-no-files-found: error
